[package]
name = "direct-cobra-copy"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench_beam"
path = "src/bin/bench_beam.rs"

[[bin]]
name = "perft_cli"
path = "src/bin/perft_cli.rs"

[[bin]]
name = "profile_perft"
path = "src/bin/profile_perft.rs"

[[bin]]
name = "bench_perft"
path = "src/bin/bench_perft.rs"

[[bin]]
name = "calibrate_skill_buckets"
path = "src/bin/calibrate_skill_buckets.rs"

[[bin]]
name = "replay_validation_gate"
path = "src/bin/replay_validation_gate.rs"

[[bin]]
name = "generate_policy_value_labels"
path = "src/bin/generate_policy_value_labels.rs"

[[bin]]
name = "policy_value_runtime_parity_fixture"
path = "src/bin/policy_value_runtime_parity_fixture.rs"

[[bin]]
name = "policy_value_infer_bench"
path = "src/bin/policy_value_infer_bench.rs"

[[bin]]
name = "bench_search_throughput"
path = "src/bin/bench_search_throughput.rs"

[features]
default = ["rayon"]
rayon = ["dep:rayon"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:console_error_panic_hook"]
# Opt-in beam-search order-independence (Option D). Off by default and absent
# from the wasm build so shipped behaviour matches the deployed scalar-BFS order.
deterministic_beam_tiebreak = []
# Opt-in packed-movegen fast path + its canonical Move::raw() emission order.
# Off by default and not enabled by the wasm feature because its enumeration
# order degrades beam coaching quality (REJECTED on the net>=0 bar); the default
# build stays on the deployed pure-engine BFS-worklist order.
packed_movegen = []

[dependencies]
rayon = { version = "1.10", optional = true }
smallvec = "1.13"
wasm-bindgen = { version = "=0.2.100", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tract-onnx = "0.21"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O3', '-all']

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Unwind (not abort) so the WASM coaching entrypoints' std::panic::catch_unwind
# guards actually catch a panic and return JsValue::NULL instead of trapping the
# whole instance. An aborted panic poisons the instance and the next JsBoard.free()
# throws "attempted to take ownership of Rust value while it was borrowed".
panic = "unwind"
strip = "symbols"

# Native bench profile on equal footing with the C++ reference's -fno-exceptions;
# never used for wasm artifacts, which require unwind (see above).
[profile.bench-native]
inherits = "release"
panic = "abort"
